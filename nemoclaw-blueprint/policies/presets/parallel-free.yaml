preset:
  name: parallel-free
  description: "Parallel Search (Free) web search access"

network_policies:
  parallel-free:
    name: parallel-free
    endpoints:
      - host: search.parallel.ai
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: POST, path: "/mcp" }
    binaries:
      - { path: /usr/local/bin/node }
      - { path: /usr/bin/node }
