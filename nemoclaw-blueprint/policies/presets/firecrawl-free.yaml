preset:
  name: firecrawl-free
  description: "Firecrawl Search (Free) web search access"

network_policies:
  firecrawl-free:
    name: firecrawl-free
    endpoints:
      - host: api.firecrawl.dev
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: POST, path: "/v2/search" }
          - allow: { method: POST, path: "/v2/scrape" }
    binaries:
      - { path: /usr/local/bin/node }
      - { path: /usr/bin/node }
