id: ollama
display_name: Ollama Web Search
description: Ollama hosted web search access (https://ollama.com); optional — a locally signed-in Ollama instance needs no key
category: agent
credentials:
  - name: api_key
    description: Ollama API key (optional — only required for https://ollama.com hosted search, not a local instance)
    env_vars:
      - OLLAMA_API_KEY
    required: false
    auth_style: bearer
    header_name: authorization
    query_param: ''
endpoints:
  - host: ollama.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries:
  - /usr/local/bin/node
  - /usr/bin/node
  - /usr/local/bin/curl
  - /usr/bin/curl
inference_capable: false
